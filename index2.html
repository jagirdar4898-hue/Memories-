
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagirdar ki Riyasat | Updating...</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* Silver/Platinum Metallic Gradient Background */
            background: radial-gradient(circle, #e0e0e0 0%, #bdbdbd 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            /* Silver Border Effect */
            border: 5px solid #ffffff;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        h1 {
            /* Golden Glowing Text */
            color: #d4af37;
            font-size: 3rem;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5), 
                         0 0 20px rgba(212, 175, 55, 0.3);
            margin-bottom: 20px;
            /* Shimmer Animation */
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fcf6ba, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s infinite linear;
            background-size: 200% auto;
        }

        p {
            color: #555;
            font-family: 'Poppins', sans-serif;
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Gold Shimmer Effect */
        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Responsive Font */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>....THERE IS SOME TECHNICAL ISSUE KINDLY VISIT LATER....</h1>
        <p>Wait for the Grand Reveal</p>
    </div>

</body>
</html>
