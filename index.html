<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagirdar Pawan | Gallery</title>
    <style>
        :root { --gold: #d4af37; --dark: #0a0a0a; }
        body { background-color: var(--dark); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; text-align: center; }
        
        header { padding: 50px 20px; border-bottom: 2px solid var(--gold); background: linear-gradient(to bottom, #1a1a1a, #0a0a0a); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        h1 { font-size: 3rem; color: var(--gold); margin: 0; letter-spacing: 5px; text-transform: uppercase; text-shadow: 2px 2px 10px rgba(212, 175, 55, 0.4); }
        
        .gallery-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 40px; max-width: 1200px; margin: auto; }
        
        .card { background: #151515; border: 1px solid #333; border-radius: 12px; overflow: hidden; transition: 0.4s; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
        .card:hover { transform: translateY(-10px); border-color: var(--gold); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); }
        
        img, video { width: 100%; height: 300px; object-fit: cover; display: block; border-bottom: 1px solid #222; }
        .label { padding: 12px; font-size: 0.9rem; color: var(--gold); font-weight: bold; background: #111; }
        
        footer { padding: 30px; color: #555; font-size: 0.8rem; border-top: 1px solid #222; margin-top: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>JAGIRDAR PAWAN</h1>
    </header>

    <div class="gallery-container" id="main-gallery">
        </div>

    <footer>
        &copy; 2026 Jagirdar Pawan. All Rights Reserved.
    </footer>
<script>
    const gallery = document.getElementById('main-gallery');

    // 1. Photos (1 se 13 tak)
    for (let i = 1; i <= 13; i++) {
        gallery.innerHTML += `
            <div class="card">
                <img src="${i}.jpg" loading="lazy" onerror="this.src='${i}.jpeg'">
                <div class="label">Photo ${i}</div>
            </div>`;
    }

    // 2. Local Videos (14, 15, 16)
    const localVideos = [14, 15, 16];
    localVideos.forEach(num => {
        // 15 number ke liye humne naya naam 'test15.mp4' set kiya hai
        let vName = (num === 15) ? "test15.mp4" : num + ".mp4";
        
        gallery.innerHTML += `
            <div class="card">
                <video controls playsinline preload="auto">
                    <source src="${vName}?v=final" type="video/mp4">
                    Browser support nahi karta.
                </video>
                <div class="label">Video ${num}</div>
            </div>`;
    });

    // 3. YouTube Video (Number 17) - Direct Embed Fix
    gallery.innerHTML += `
        <div class="card">
            <iframe width="100%" height="280" 
                src="https://www.youtube.com/embed/IgM1lAXppwI" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                allowfullscreen>
            </iframe>
            <div class="label">Video 17 (YouTube)</div>
        </div>`;
</script>
</body>
</html>
