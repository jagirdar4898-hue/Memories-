<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGIRDAR | LEGENDARY GALLERY</title>
    <style>
        :root {
            --gold: #d4af37;
            --premium-black: #050505;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            background: var(--premium-black);
            color: white;
            font-family: 'Cinzel', serif; /* Royal look ke liye */
            text-align: center;
        }

        header {
            padding: 60px 20px;
            background: radial-gradient(circle, rgba(212,175,55,0.1) 0%, transparent 70%);
        }

        header h1 {
            font-size: 3.5rem;
            color: var(--gold);
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow: 0 0 30px rgba(212,175,55,0.4);
            margin-bottom: 40px;
        }

        /* LEGENDARY BUTTONS */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 2px solid var(--gold);
            color: var(--gold);
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 0px; /* Sharp edges for legend look */
            transition: 0.5s;
            position: relative;
            overflow: hidden;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--gold);
            color: black;
            box-shadow: 0 0 20px var(--gold);
        }

        .container {
            max-width: 1300px;
            margin: 50px auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            min-height: 400px;
        }

        .card {
            background: var(--glass);
            border: 1px solid rgba(212,175,55,0.1);
            position: relative;
            overflow: hidden;
            transition: 0.4s;
            backdrop-filter: blur(10px);
        }

        .card:hover {
            border: 1px solid var(--gold);
            transform: translateY(-10px);
        }

        .card img, .card video, .card iframe {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .label {
            padding: 15px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--gold);
            background: rgba(0,0,0,0.8);
            text-transform: uppercase;
        }

        footer {
            padding: 80px;
            color: var(--gold);
            letter-spacing: 5px;
            font-size: 1.2rem;
            border-top: 1px solid rgba(212,175,55,0.2);
        }

        /* Smooth load animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card { animation: fadeIn 0.8s ease forwards; }

    </style>
</head>
<body>

<header>
    <h1>JAGIRDAR</h1>
    <div class="tabs">
        <button class="tab-btn" onclick="showGallery('all')">ALL</button>
        <button class="tab-btn" onclick="showGallery('photo')">PHOTOS</button>
        <button class="tab-btn" onclick="showGallery('video')">VIDEOS</button>
    </div>
</header>

<div class="container" id="main-gallery">
    <div id="status" style="grid-column: 1/-1; color: #555; font-size: 1.5rem; letter-spacing: 3px;">
        SELECT A CATEGORY TO UNLEASH MEMORIES
    </div>
</div>

<footer>
    EST. 2026 | JAGIRDAR LEGACY
</footer>

<script>
    const container = document.getElementById('main-gallery');
    const user = "jagirdar4898-hue";
    const repo = "Memories-";
    const folder = "gallery";

    async function showGallery(category) {
        // Clear container and show loading
        container.innerHTML = '<div style="grid-column: 1/-1; color: var(--gold);">LOADING LEGACY...</div>';
        
        // Tab highlight logic
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        let htmlContent = "";

        // 1. Purani 1-13 Photos (sirf tab jab 'all' ya 'photo' ho)
        if(category === 'all' || category === 'photo') {
            for (let i = 1; i <= 13; i++) {
                htmlContent += `<div class="card"><img src="${i}.jpg" onerror="this.src='${i}.jpeg'"><div class="label">MEMORY ${i}</div></div>`;
            }
        }

        // 2. Purani Videos 14-17 (sirf tab jab 'all' ya 'video' ho)
        if(category === 'all' || category === 'video') {
            htmlContent += `<div class="card"><video controls><source src="14.mp4"></video><div class="label">VIDEO 14</div></div>`;
            htmlContent += `<div class="card"><video controls><source src="15.mp4"></video><div class="label">VIDEO 15</div></div>`;
            htmlContent += `<div class="card"><video controls><source src="16.mp4"></video><div class="label">VIDEO 16</div></div>`;
            htmlContent += `<div class="card"><iframe src="https://www.youtube.com/embed/IgM1lAXppwI" frameborder="0"></iframe><div class="label">VIDEO 17</div></div>`;
        }

        // 3. Nayi Files 'gallery' folder se (Automatic filtering)
        try {
            const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`);
            const files = await res.json();
            
            files.forEach(file => {
                const name = file.name.toLowerCase();
                if(name === 'index.txt') return;

                const isImg = name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png');
                const isVid = name.endsWith('.mp4') || name.endsWith('.mov');

                if ((category === 'all') || (category === 'photo' && isImg) || (category === 'video' && isVid)) {
                    let media = isImg ? `<img src="${file.download_url}">` : `<video controls playsinline><source src="${file.download_url}"></video>`;
                    htmlContent += `<div class="card">${media}<div class="label">${file.name}</div></div>`;
                }
            });
        } catch (e) { console.log("Gallery folder loading..."); }

        container.innerHTML = htmlContent;
    }
</script>

</body>
</html>
