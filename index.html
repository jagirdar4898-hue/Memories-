<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGIRDAR | PAWAN SINGH RAJPUROHIT | LEGENDARY GALLERY</title>
    
    <meta name="description" content="Official JAGIRDAR Gallery by Pawan Singh Rajpurohit. Jain School Osian, Arts Class 12, Year 2025-26. Explore the legacy.">
    <meta name="keywords" content="JAGIRDAR, Pawan Singh Rajpurohit, Jagirdar Pawan, Jain School Osian, Arts Class 12, Year 2025 26, Jagirdar Gallery, Pawan Singh Osian">
    <meta name="author" content="Pawan Singh Rajpurohit">
    <meta name="robots" content="index, follow">

    <style>
        :root { --gold: #d4af37; --black: #050505; --red: #ff4d4d; }
        body { margin: 0; background: var(--black); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; overflow-x: hidden; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: rgba(255,255,255,0.05); padding: 40px; border: 1px solid var(--gold); border-radius: 15px; backdrop-filter: blur(10px); text-align: center; }
        .login-btn { padding: 12px 25px; margin: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; width: 220px; display: block; border: none; transition: 0.3s; }

        header { padding: 40px 20px; }
        .tab-btn { background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 10px 25px; cursor: pointer; margin: 5px; transition: 0.4s; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
        
        .upload-section { background: #111; padding: 25px; margin: 20px auto; max-width: 500px; border: 2px dashed var(--gold); border-radius: 10px; }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 20px; max-width: 1400px; margin: auto; }
        .card { border: 1px solid rgba(212,175,55,0.1); overflow: hidden; background: #111; border-radius: 10px; position: relative; transition: 0.3s; }
        .card:hover { transform: translateY(-5px); border-color: var(--gold); }
        .card img, .card video { width: 100%; height: 320px; object-fit: cover; }
        
        .actions { display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #222; }
        .action-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .del-btn { color: var(--red) !important; font-size: 0.8rem !important; }

        .comment-section { padding: 12px; text-align: left; background: #0a0a0a; max-height: 120px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid #222; }
        .comment-input-area { padding: 10px; display: flex; gap: 5px; }
        .comment-input { flex: 1; background: #222; border: 1px solid var(--gold); color: white; padding: 8px; border-radius: 5px; }
        
        #chat-area { display: none; padding: 20px; max-width: 900px; margin: auto; }
        footer { padding: 60px; color: var(--gold); opacity: 0.6; font-size: 0.8rem; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: var(--gold); letter-spacing: 12px;">JAGIRDAR</h1>
    <div class="login-box">
        <button class="login-btn" style="background: #fff; color: #000;" onclick="loginGoogle()">SIGN IN WITH GOOGLE</button>
        <button class="login-btn" style="background: transparent; border: 1px solid var(--gold); color: var(--gold);" onclick="loginGuest()">CONTINUE AS GUEST</button>
    </div>
</div>

<div id="main-content" style="display: none;">
    <header>
        <h1 style="color: var(--gold); letter-spacing: 8px;">JAGIRDAR</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="location.reload()">GALLERY</button>
            <button class="tab-btn" onclick="showChat(event)">CHAT ✉️</button>
            <button class="tab-btn" onclick="auth.signOut()" style="border-color:var(--red); color:var(--red);">LOGOUT</button>
        </div>
    </header>

    <div class="upload-section" id="upload-panel">
        <button id="upload_widget" style="background: var(--gold); border:none; padding: 15px 30px; cursor:pointer; font-weight:bold; border-radius: 5px; font-size: 1rem;">📤 POST NEW MEMORY</button>
        <p style="font-size: 0.7rem; color: gray; margin-top: 10px;">Only logged-in users can post photos/videos.</p>
    </div>

    <div class="container" id="main-gallery"></div>
    <div id="chat-area"><iframe src="https://deadsimplechat.com/VcwE7MpUc" width="100%" height="600px" frameborder="0"></iframe></div>

    <footer>© 2026 JAGIRDAR LEGACY | PAWAN SINGH RAJPUROHIT ☠️</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyChMaUpvqhOwLwePpPv-X-24jFzQmRfrZs",
        authDomain: "jagirdar-c39e8.firebaseapp.com",
        projectId: "jagirdar-c39e8",
        storageBucket: "jagirdar-c39e8.firebasestorage.app",
        messagingSenderId: "379511970061",
        appId: "1:379511970061:web:abb7e3bda9d76617687844"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ☠️ CLOUDINARY UPDATED CONFIG
    const CLOUD_NAME = "dd9wtjaso"; 
    const UPLOAD_PRESET = "ml_default";

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadGallery();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
        }
    });

    function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function loginGuest() { auth.signInAnonymously(); }

    // Cloudinary Upload Widget Setup
    var myWidget = cloudinary.createUploadWidget({
        cloudName: CLOUD_NAME, 
        uploadPreset: UPLOAD_PRESET,
        sources: ['local', 'url', 'camera'],
        googleApiKey: '<image_search_google_api_key>',
        multiple: false,
        theme: "minimal"
    }, (error, result) => { 
        if (!error && result && result.event === "success") { 
            db.collection('posts').add({
                url: result.info.secure_url,
                type: result.info.resource_type,
                owner: auth.currentUser.uid,
                ownerName: auth.currentUser.displayName || "Jagirdar User",
                createdAt: Date.now()
            }).then(() => {
                alert("Posted successfully!");
                location.reload();
            });
        }
    });

    document.getElementById("upload_widget").addEventListener("click", function(){
        if(auth.currentUser.isAnonymous) return alert("Guest users cannot upload. Please Sign-in with Google.");
        myWidget.open();
    }, false);

    async function loadGallery() {
        const container = document.getElementById('main-gallery');
        container.innerHTML = "☠️ FETCHING LEGACY...";
        const snap = await db.collection('posts').orderBy('createdAt', 'desc').get();
        
        let html = "";
        if(snap.empty) { container.innerHTML = "No memories posted yet. Be the first!"; return; }

        snap.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            const isOwner = auth.currentUser && auth.currentUser.uid === data.owner;

            html += `
            <div class="card">
                ${data.type === 'video' ? `<video controls src="${data.url}"></video>` : `<img src="${data.url}" loading="lazy">`}
                <div class="actions">
                    <button class="action-btn" onclick="toggleLike('${id}')">
                        <span id="heart-${id}" style="transition:0.3s;">❤️</span> 
                        <span id="like-${id}">0</span>
                    </button>
                    <button class="action-btn" onclick="shareMedia('${data.url}')">🔗 SHARE</button>
                    ${isOwner ? `<button class="action-btn del-btn" onclick="deletePost('${id}')">🗑️ DELETE</button>` : ''}
                </div>
                <div class="comment-section" id="comments-${id}">Loading comments...</div>
                <div class="comment-input-area">
                    <input class="comment-input" id="input-${id}" placeholder="Write a comment...">
                    <button onclick="addComment('${id}')" style="background:var(--gold); border:none; padding:8px; cursor:pointer; border-radius:5px;">➤</button>
                </div>
            </div>`;
            setTimeout(() => { updateLikesUI(id); loadComments(id); }, 100);
        });
        container.innerHTML = html;
    }

    async function deletePost(id) {
        if(confirm("Are you sure you want to delete your post?")) {
            await db.collection('posts').doc(id).delete();
            location.reload();
        }
    }

    async function toggleLike(id) {
        if(auth.currentUser.isAnonymous) return alert("Login to Like!");
        const uid = auth.currentUser.uid;
        const likeRef = db.collection('posts').doc(id).collection('likes').doc(uid);
        const doc = await likeRef.get();

        if(doc.exists) {
            await likeRef.delete();
        } else {
            await likeRef.set({liked: true});
        }
        updateLikesUI(id);
    }

    async function updateLikesUI(id) {
        const snap = await db.collection('posts').doc(id).collection('likes').get();
        document.getElementById(`like-${id}`).innerText = snap.size;
        
        if(auth.currentUser) {
            const userLiked = await db.collection('posts').doc(id).collection('likes').doc(auth.currentUser.uid).get();
            document.getElementById(`heart-${id}`).style.filter = userLiked.exists ? "grayscale(0)" : "grayscale(1)";
        }
    }

    async function addComment(id) {
        const input = document.getElementById(`input-${id}`);
        if(!input.value || auth.currentUser.isAnonymous) return alert("Please login to comment!");
        
        await db.collection('posts').doc(id).collection('comments').add({
            text: input.value,
            user: auth.currentUser.displayName || "Jagirdar User",
            time: Date.now()
        });
        input.value = '';
        loadComments(id);
    }

    async function loadComments(id) {
        const box = document.getElementById(`comments-${id}`);
        const snap = await db.collection('posts').doc(id).collection('comments').orderBy('time', 'desc').limit(5).get();
        if(snap.empty) { box.innerHTML = "No comments yet."; return; }
        box.innerHTML = snap.docs.map(d => `<div><b style="color:var(--gold)">${d.data().user}:</b> ${d.data().text}</div>`).join('');
    }

    function shareMedia(url) { window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("Check out this JAGIRDAR Memory: " + url)}`); }
    function showChat(e) {
        if(e) e.preventDefault();
        document.getElementById('main-gallery').style.display = 'none';
        document.getElementById('upload-panel').style.display = 'none';
        document.getElementById('chat-area').style.display = 'block';
    }
</script>
</body>
</html>
