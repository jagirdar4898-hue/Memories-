<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagirdar Premium Gallery</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 50px 20px;
            background: linear-gradient(to bottom, rgba(212,175,55,0.15), transparent);
        }

        header h1 {
            color: var(--gold);
            font-size: clamp(2rem, 8vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 8px;
            margin: 0;
            text-shadow: 0 0 20px rgba(212,175,55,0.5);
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            overflow: hidden;
            backdrop-filter: blur(15px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: scale(1.05);
            border: 1px solid var(--gold);
            box-shadow: 0 10px 30px rgba(212,175,55,0.2);
        }

        .card img, .card video, .card iframe {
            width: 100%;
            display: block;
            object-fit: cover;
            aspect-ratio: 1/1; /* Photos square rahengi, premium lagti hain */
        }
        
        .card video, .card iframe {
            aspect-ratio: 16/9; /* Videos wide rahenge */
        }

        .label {
            padding: 15px;
            text-align: center;
            font-size: 0.85rem;
            color: #aaa;
            background: rgba(0,0,0,0.3);
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        footer {
            text-align: center;
            padding: 60px 20px;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--gold);
            font-style: italic;
            padding: 20px;
        }
    </style>
</head>
<body>

<header>
    <h1>Jagirdar</h1>
</header>

<div class="container" id="main-gallery">
    <script>
        const container = document.getElementById('main-gallery');
        // Photos 1 to 13
        for (let i = 1; i <= 13; i++) {
            container.innerHTML += `
                <div class="card">
                    <img src="${i}.jpg" loading="lazy" onerror="this.src='${i}.jpeg'">
                    <div class="label">Yaad ${i}</div>
                </div>`;
        }
    </script>

    <div class="card"><video controls><source src="14.mp4"></video><div class="label">Video 14</div></div>
    <div class="card"><video controls><source src="15.mp4"></video><div class="label">Video 15</div></div>
    <div class="card"><video controls><source src="16.mp4"></video><div class="label">Video 16</div></div>

    <div class="card">
        <iframe src="https://www.youtube.com/embed/IgM1lAXppwI" frameborder="0" allowfullscreen></iframe>
        <div class="label">Tere Jaisa Yaar Kahan</div>
    </div>

    <div id="loader" class="status-msg">Nayi yaadein load ho rahi hain...</div>
</div>

<footer>
    &copy; 2026 PAWAN | SAKHT LAUNDA
</footer>

<script>
    async function loadGalleryFolder() {
        const user = "jagirdar4898-hue";
        const repo = "Memories-";
        const folder = "gallery";
        
        try {
            const response = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}`);
            const files = await response.json();
            document.getElementById('loader').style.display = 'none';

            files.forEach(file => {
                const name = file.name.toLowerCase();
                if (name === 'index.txt' || name === 'placeholder.txt') return;

                let html = '';
                if (name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png')) {
                    html = `<img src="${file.download_url}" loading="lazy">`;
                } else if (name.endsWith('.mp4') || name.endsWith('.mov')) {
                    html = `<video controls playsinline><source src="${file.download_url}"></video>`;
                }

                if (html) {
                    container.innerHTML += `<div class="card">${html}<div class="label">${file.name}</div></div>`;
                }
            });
        } catch (e) {
            document.getElementById('loader').innerText = "Nayi files folder mein upload karein!";
        }
    }
    loadGalleryFolder();
</script>

</body>
</html>
