<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagirdar Premium Gallery</title>
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--dark-bg);
            color: white;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
        }

        /* Background Design */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(to bottom, rgba(212,175,55,0.1), transparent);
        }

        header h1 {
            color: var(--gold);
            font-size: 2.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin: 0;
            text-shadow: 0 0 20px rgba(212,175,55,0.5);
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, border 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            border: 1px solid var(--gold);
        }

        .card img, .card video, .card iframe {
            width: 100%;
            display: block;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .card iframe { height: 250px; }

        .label {
            padding: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #ccc;
            background: rgba(0,0,0,0.5);
        }

        footer {
            text-align: center;
            padding: 40px;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 2px;
            border-top: 1px solid rgba(212,175,55,0.2);
            margin-top: 50px;
        }

        /* Loading Animation */
        .loader {
            text-align: center;
            color: var(--gold);
            padding: 20px;
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

<header>
    <h1>Jagirdar Memories</h1>
</header>

<div class="container" id="main-gallery">
    <div class="card"><video controls><source src="14.mp4"></video><div class="label">Memory 14</div></div>
    <div class="card"><video controls><source src="15.mp4"></video><div class="label">Memory 15</div></div>
    <div class="card"><video controls><source src="16.mp4"></video><div class="label">Memory 16</div></div>

    <div class="card">
        <iframe src="https://www.youtube.com/embed/IgM1lAXppwI" frameborder="0" allowfullscreen></iframe>
        <div class="label">Tere Jaisa Yaar Kahan</div>
    </div>

    <div id="auto-files" class="loader">Nayi yaadein load ho rahi hain...</div>
</div>

<footer>
    &copy; 2026 JAGIRDAR | SAKHT LAUNDA
</footer>

<script>
    const autoContainer = document.getElementById('main-gallery');
    const username = "jagirdar4898-hue";
    const repo = "Memories-";
    const folder = "gallery";

    async function loadNewFiles() {
        try {
            const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/${folder}`);
            const files = await response.json();
            
            document.getElementById('auto-files').style.display = 'none';

            files.forEach(file => {
                const name = file.name.toLowerCase();
                const url = file.download_url;

                // Skip placeholder file
                if(name.includes('index.txt')) return;

                let content = '';
                if (name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png')) {
                    content = `<img src="${url}" loading="lazy">`;
                } else if (name.endsWith('.mp4') || name.endsWith('.mov')) {
                    content = `<video controls playsinline><source src="${url}" type="video/mp4"></video>`;
                }

                if(content) {
                    autoContainer.innerHTML += `
                        <div class="card">
                            ${content}
                            <div class="label">${file.name}</div>
                        </div>`;
                }
            });
        } catch (e) {
            console.log("Nayi files abhi nahi mili");
        }
    }

    loadNewFiles();
</script>

</body>
</html>
