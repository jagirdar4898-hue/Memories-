<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagirdar Pawan Gallery</title>
    <style>
        :root { --gold: #d4af37; --dark: #0a0a0a; }
        body { background-color: var(--dark); color: white; font-family: sans-serif; margin: 0; text-align: center; }
        header { padding: 40px; border-bottom: 2px solid var(--gold); background: #1a1a1a; }
        h1 { color: var(--gold); font-size: 2.5rem; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; padding: 30px; }
        .card { background: #151515; border-radius: 12px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .card:hover { transform: scale(1.03); border-color: var(--gold); }
        img, video { width: 100%; height: 250px; object-fit: cover; }
        .name { padding: 10px; font-size: 0.8rem; color: #888; }
    </style>
</head>
<body>

    <header>
        <h1>JAGIRDAR PAWAN</h1>
    </header>

    <div class="gallery" id="media-gallery">
        </div>

    <script>
        // --- SIRF YE DO CHEEZAIN BADLEIN ---
        const username = "APKA_GITHUB_USERNAME"; // Apna GitHub naam likhein
        const repo = "APKI_REPO_KA_NAAM";       // Apni repository ka naam likhein

        async function loadGallery() {
            const gallery = document.getElementById('media-gallery');
            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();

                files.forEach(file => {
                    const name = file.name.toLowerCase();
                    if (name.match(/\.(jpg|jpeg|png|webp|gif)$/)) {
                        gallery.innerHTML += `<div class="card"><img src="${file.download_url}"><div class="name">${file.name}</div></div>`;
                    } else if (name.match(/\.(mp4|webm|mov)$/)) {
                        gallery.innerHTML += `<div class="card"><video controls src="${file.download_url}"></video><div class="name">${file.name}</div></div>`;
                    }
                });
            } catch (e) {
                console.error("Error loading files:", e);
            }
        }
        loadGallery();
    </script>
</body>
</html>
