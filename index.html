<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGIRDAR | LEGENDARY GALLERY</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        body { margin: 0; background: var(--black); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; overflow-x: hidden; }
        
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; 
            align-items: center; justify-content: center; flex-direction: column;
        }
        .login-box {
            background: rgba(255,255,255,0.05); padding: 40px;
            border: 1px solid var(--gold); border-radius: 15px;
            backdrop-filter: blur(10px); text-align: center;
        }
        .login-btn {
            padding: 12px 25px; margin: 10px; cursor: pointer; font-weight: bold;
            border-radius: 5px; width: 220px; display: block; border: none; transition: 0.3s;
        }

        header { padding: 40px 20px; }
        .tab-btn { background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 10px 25px; cursor: pointer; margin: 5px; transition: 0.4s; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 20px; max-width: 1400px; margin: auto; }
        
        /* ☠️ CARD ENHANCEMENTS */
        .card { border: 1px solid rgba(212,175,55,0.1); overflow: hidden; background: #111; border-radius: 10px; }
        .card img, .card video { width: 100%; height: 300px; object-fit: cover; }
        
        .actions { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #222; }
        .action-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.2rem; }
        
        .comment-section { padding: 10px; text-align: left; background: #0a0a0a; max-height: 100px; overflow-y: auto; font-size: 0.8rem; }
        .comment-input { width: 80%; background: #222; border: 1px solid var(--gold); color: white; padding: 5px; border-radius: 3px; }
        
        #chat-area { display: none; padding: 20px; max-width: 900px; margin: auto; }
        footer { padding: 60px; color: var(--gold); opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: var(--gold); letter-spacing: 12px;">JAGIRDAR</h1>
    <div class="login-box">
        <button class="login-btn" style="background: #fff; color: #000;" onclick="loginGoogle()">SIGN IN WITH GOOGLE</button>
        <button class="login-btn" style="background: transparent; border: 1px solid var(--gold); color: var(--gold);" onclick="loginGuest()">CONTINUE AS GUEST</button>
    </div>
</div>

<div id="main-content" style="display: none;">
    <header>
        <h1 style="color: var(--gold); letter-spacing: 8px;">JAGIRDAR</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="showGallery('all')">ALL</button>
            <button class="tab-btn" onclick="showGallery('photo')">PHOTOS</button>
            <button class="tab-btn" onclick="showGallery('video')">VIDEOS</button>
            <button class="tab-btn" onclick="showChat(event)">✉️</button>
        </div>
    </header>

    <div class="container" id="main-gallery"></div>

    <div id="chat-area">
        <div style="border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; background: #000;">
            <iframe src="https://deadsimplechat.com/VcwE7MpUc" width="100%" height="600px" frameborder="0"></iframe>
        </div>
    </div>

    <footer>© 2026 JAGIRDAR LEGACY | UNSTOPPABLE ☠️</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyChMaUpvqhOwLwePpPv-X-24jFzQmRfrZs",
        authDomain: "jagirdar-c39e8.firebaseapp.com",
        projectId: "jagirdar-c39e8",
        storageBucket: "jagirdar-c39e8.firebasestorage.app",
        messagingSenderId: "379511970061",
        appId: "1:379511970061:web:abb7e3bda9d76617687844"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            showGallery('all');
        } else {
            document.getElementById('login-screen').style.display = 'flex';
        }
    });

    function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function loginGuest() { auth.signInAnonymously(); }

    // ☠️ SOCIAL FEATURES
    async function toggleLike(id) {
        const ref = db.collection('likes').doc(id);
        const doc = await ref.get();
        let count = doc.exists ? doc.data().count : 0;
        await ref.set({ count: count + 1 });
        document.getElementById(`like-count-${id}`).innerText = count + 1;
    }

    async function addComment(id) {
        const input = document.getElementById(`input-${id}`);
        if(!input.value) return;
        const ref = db.collection('comments').doc(id).collection('list');
        await ref.add({ text: input.value, user: auth.currentUser.displayName || "Guest", time: Date.now() });
        input.value = '';
        loadComments(id);
    }

    async function loadComments(id) {
        const box = document.getElementById(`comments-${id}`);
        const snap = await db.collection('comments').doc(id).collection('list').orderBy('time', 'desc').limit(5).get();
        box.innerHTML = snap.docs.map(d => `<div><b>${d.data().user}:</b> ${d.data().text}</div>`).join('');
    }

    function shareMedia(url) {
        const text = `Check out this legacy memory: ${url}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`);
    }

    function showChat(e) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('main-gallery').style.display = 'none';
        document.getElementById('chat-area').style.display = 'block';
    }

    async function showGallery(category) {
        document.getElementById('chat-area').style.display = 'none';
        const container = document.getElementById('main-gallery');
        container.style.display = 'grid';
        container.innerHTML = '☠️ LOADING...';
        
        let htmlContent = "";
        const res = await fetch(`https://api.github.com/repos/jagirdar4898-hue/Memories-/contents/gallery`);
        const files = await res.json();
        
        for(let file of files.reverse()) {
            const name = file.name.toLowerCase();
            const isImg = name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png');
            if(isImg) {
                const id = name.replace(/\.[^/.]+$/, "");
                htmlContent += `
                <div class="card">
                    <img src="${file.download_url}">
                    <div class="actions">
                        <button class="action-btn" onclick="toggleLike('${id}')">❤️ <span id="like-count-${id}">0</span></button>
                        <button class="action-btn" onclick="shareMedia('${file.download_url}')">🔗</button>
                    </div>
                    <div class="comment-section" id="comments-${id}">Loading comments...</div>
                    <div style="padding:10px;">
                        <input class="comment-input" id="input-${id}" placeholder="Write comment...">
                        <button onclick="addComment('${id}')" style="background:var(--gold); border:none; padding:5px;">➤</button>
                    </div>
                </div>`;
                setTimeout(() => {
                    db.collection('likes').doc(id).get().then(d => { if(d.exists) document.getElementById(`like-count-${id}`).innerText = d.data().count; });
                    loadComments(id);
                }, 500);
            }
        }
        container.innerHTML = htmlContent;
    }
</script>
</body>
    </html>
