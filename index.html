<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>JAGIRDAR | PAWAN SINGH RAJPUROHIT | LEGENDARY GALLERY</title>
    <meta name="description" content="Official JAGIRDAR Gallery by Pawan Singh Rajpurohit. Memories of Jain School Osian, Arts Class 12, Year 2025-26. Explore the legacy of Jagirdar Pawan.">
    <meta name="keywords" content="JAGIRDAR, Pawan Singh Rajpurohit, Jagirdar Pawan, Jain School Osian, Arts Class 12, Year 2025 26, Jagirdar Gallery, Osian School Memories, Pawan Jagirdar Legacy">
    <meta name="author" content="Pawan Singh Rajpurohit">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="JAGIRDAR | PAWAN SINGH RAJPUROHIT">
    <meta property="og:description" content="Exclusive Gallery: Jain School Osian | Arts Class 12 | 2025-26">
    <meta property="og:type" content="website">
    
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        body { margin: 0; background: var(--black); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; overflow-x: hidden; }
        
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex; 
            align-items: center; justify-content: center; flex-direction: column;
        }
        .login-box {
            background: rgba(255,255,255,0.05); padding: 40px;
            border: 1px solid var(--gold); border-radius: 15px;
            backdrop-filter: blur(10px); text-align: center;
        }
        .login-btn {
            padding: 12px 25px; margin: 10px; cursor: pointer; font-weight: bold;
            border-radius: 5px; width: 220px; display: block; border: none; transition: 0.3s;
        }

        header { padding: 40px 20px; }
        .tab-btn { background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 10px 25px; cursor: pointer; margin: 5px; transition: 0.4s; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: black; box-shadow: 0 0 15px var(--gold); }
        
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 20px; max-width: 1400px; margin: auto; }
        
        .card { border: 1px solid rgba(212,175,55,0.1); overflow: hidden; background: #111; border-radius: 10px; position: relative; }
        .card img, .card video { width: 100%; height: 300px; object-fit: cover; }
        
        .actions { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #222; }
        .action-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; gap: 5px; }
        
        .comment-section { padding: 10px; text-align: left; background: #0a0a0a; max-height: 120px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid #222; }
        .comment-input-area { padding: 10px; display: flex; gap: 5px; }
        .comment-input { flex: 1; background: #222; border: 1px solid var(--gold); color: white; padding: 8px; border-radius: 5px; }
        
        #chat-area { display: none; padding: 20px; max-width: 900px; margin: auto; }
        footer { padding: 60px; color: var(--gold); opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: var(--gold); letter-spacing: 12px;">JAGIRDAR</h1>
    <div class="login-box">
        <button class="login-btn" style="background: #fff; color: #000;" onclick="loginGoogle()">SIGN IN WITH GOOGLE</button>
        <button class="login-btn" style="background: transparent; border: 1px solid var(--gold); color: var(--gold);" onclick="loginGuest()">CONTINUE AS GUEST</button>
    </div>
</div>

<div id="main-content" style="display: none;">
    <header>
        <h1 style="color: var(--gold); letter-spacing: 8px;">JAGIRDAR</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="showGallery('all')">ALL</button>
            <button class="tab-btn" onclick="showGallery('photo')">PHOTOS</button>
            <button class="tab-btn" onclick="showGallery('video')">VIDEOS</button>
            <button class="tab-btn" onclick="showChat(event)">✉️</button>
        </div>
    </header>

    <div style="display:none;">
        <iframe id="bg-track" src="https://www.youtube.com/embed/IgM1lAXppwI?enablejsapi=1&loop=1&playlist=IgM1lAXppwI"></iframe>
    </div>

    <div class="container" id="main-gallery"></div>

    <div id="chat-area">
        <div style="border: 2px solid var(--gold); border-radius: 15px; overflow: hidden; background: #000;">
            <iframe src="https://deadsimplechat.com/VcwE7MpUc" width="100%" height="600px" frameborder="0"></iframe>
        </div>
    </div>

    <footer>© 2026 JAGIRDAR LEGACY | UNSTOPPABLE ☠️</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyChMaUpvqhOwLwePpPv-X-24jFzQmRfrZs",
        authDomain: "jagirdar-c39e8.firebaseapp.com",
        projectId: "jagirdar-c39e8",
        storageBucket: "jagirdar-c39e8.firebasestorage.app",
        messagingSenderId: "379511970061",
        appId: "1:379511970061:web:abb7e3bda9d76617687844"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    auth.onAuthStateChanged(user => {
        const loginScreen = document.getElementById('login-screen');
        const mainContent = document.getElementById('main-content');
        if (user) {
            loginScreen.style.display = 'none';
            mainContent.style.display = 'block';
            showGallery('all');
        } else {
            loginScreen.style.display = 'flex';
            mainContent.style.display = 'none';
        }
    });

    function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function loginGuest() { auth.signInAnonymously(); }

    async function toggleLike(id) {
        if(!auth.currentUser) return;
        const userId = auth.currentUser.uid;
        const likeRef = db.collection('likes').doc(id);
        const userLikeRef = likeRef.collection('users').doc(userId);
        const doc = await userLikeRef.get();
        const mainDoc = await likeRef.get();
        let count = mainDoc.exists ? mainDoc.data().count : 0;

        if (doc.exists) {
            await userLikeRef.delete();
            count = Math.max(0, count - 1);
            await likeRef.set({ count: count });
            document.getElementById(`heart-${id}`).style.color = "var(--gold)";
        } else {
            await userLikeRef.set({ liked: true });
            count = count + 1;
            await likeRef.set({ count: count });
            document.getElementById(`heart-${id}`).style.color = "red";
        }
        document.getElementById(`like-count-${id}`).innerText = count;
    }

    async function addComment(id) {
        const input = document.getElementById(`input-${id}`);
        if(!input.value || !auth.currentUser) return;
        const ref = db.collection('comments').doc(id).collection('list');
        await ref.add({ text: input.value, user: auth.currentUser.displayName || "Guest", time: Date.now() });
        input.value = '';
        loadComments(id);
    }

    async function loadComments(id) {
        const box = document.getElementById(`comments-${id}`);
        const snap = await db.collection('comments').doc(id).collection('list').orderBy('time', 'desc').limit(10).get();
        box.innerHTML = snap.docs.length ? snap.docs.map(d => `<div><b style="color:var(--gold)">${d.data().user}:</b> ${d.data().text}</div>`).join('') : "No comments yet.";
    }

    function shareMedia(url) {
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("Check this out on JAGIRDAR: " + url)}`);
    }

    function showChat(e) {
        if(e) e.preventDefault();
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        document.getElementById('main-gallery').style.display = 'none';
        document.getElementById('chat-area').style.display = 'block';
    }

    function playSecretMusic() {
        const iframe = document.getElementById("bg-track");
        if(iframe) iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    }
    function pauseMusic() {
        const iframe = document.getElementById("bg-track");
        if(iframe) iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    }

    async function showGallery(category) {
        document.getElementById('chat-area').style.display = 'none';
        const container = document.getElementById('main-gallery');
        container.style.display = 'grid';
        container.innerHTML = '<div style="grid-column: 1/-1;">☠️ LOADING LEGACY...</div>';
        
        let htmlContent = "";
        const res = await fetch(`https://api.github.com/repos/jagirdar4898-hue/Memories-/contents/gallery`);
        const files = await res.json();
        const userId = auth.currentUser ? auth.currentUser.uid : null;

        for(let file of files.reverse()) {
            const name = file.name.toLowerCase();
            const isImg = name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png');
            const isVid = name.endsWith('.mp4');
            const id = btoa(name).replace(/=/g, "");

            if ((category==='all') || (category==='photo'&&isImg) || (category==='video'&&isVid)) {
                let media = isImg ? `<img src="${file.download_url}" loading="lazy">` : `<video controls onplay="pauseMusic()" onpause="playSecretMusic()"><source src="${file.download_url}"></video>`;
                htmlContent += `
                <div class="card">
                    ${media}
                    <div class="actions">
                        <button class="action-btn" onclick="toggleLike('${id}')"><span id="heart-${id}">❤</span> <span id="like-count-${id}">0</span></button>
                        <button class="action-btn" onclick="shareMedia('${file.download_url}')">🔗 SHARE</button>
                    </div>
                    <div class="comment-section" id="comments-${id}">Loading...</div>
                    <div class="comment-input-area">
                        <input class="comment-input" id="input-${id}" placeholder="Add a comment...">
                        <button onclick="addComment('${id}')" style="background:var(--gold); border:none; padding:8px; cursor:pointer; border-radius:5px;">➤</button>
                    </div>
                </div>`;
                
                setTimeout(async () => {
                    const d = await db.collection('likes').doc(id).get();
                    if(d.exists) document.getElementById(`like-count-${id}`).innerText = d.data().count;
                    if(userId) {
                        const uLike = await db.collection('likes').doc(id).collection('users').doc(userId).get();
                        if(uLike.exists) document.getElementById(`heart-${id}`).style.color = "red";
                    }
                    loadComments(id);
                }, 100);
            }
        }
        container.innerHTML = htmlContent;
    }
</script>
</body>
            </html>
