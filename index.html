<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGIRDAR | PAWAN SINGH RAJPUROHIT | LEGENDARY GALLERY</title>
    <meta name="description" content="Official JAGIRDAR Gallery by Pawan Singh Rajpurohit. Jain School Osian, Arts Class 12, Year 2025-26.">
    <meta name="keywords" content="JAGIRDAR, Pawan Singh Rajpurohit, Jagirdar Pawan, Jain School Osian, Arts Class 12, Year 2025 26">
    
    <style>
        :root { --gold: #d4af37; --black: #050505; --red: #ff4d4d; }
        body { margin: 0; background: var(--black); color: white; font-family: 'Segoe UI', sans-serif; text-align: center; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .login-box { background: rgba(255,255,255,0.05); padding: 40px; border: 1px solid var(--gold); border-radius: 15px; backdrop-filter: blur(10px); }
        .login-btn { padding: 12px 25px; margin: 10px; cursor: pointer; font-weight: bold; border-radius: 5px; width: 220px; display: block; border: none; }

        header { padding: 40px 20px; }
        .tab-btn { background: transparent; border: 2px solid var(--gold); color: var(--gold); padding: 10px 25px; cursor: pointer; margin: 5px; font-weight: bold; }
        .tab-btn.active { background: var(--gold); color: black; }
        
        .upload-section { background: #111; padding: 20px; margin: 20px auto; max-width: 600px; border: 1px dashed var(--gold); border-radius: 10px; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; padding: 20px; max-width: 1400px; margin: auto; }
        
        .card { border: 1px solid rgba(212,175,55,0.1); overflow: hidden; background: #111; border-radius: 10px; position: relative; }
        .card img, .card video { width: 100%; height: 300px; object-fit: cover; }
        
        .actions { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #222; }
        .action-btn { background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.1rem; }
        .del-btn { color: var(--red) !important; font-size: 0.8rem !important; }
        
        .comment-section { padding: 10px; text-align: left; background: #0a0a0a; max-height: 100px; overflow-y: auto; font-size: 0.8rem; }
        .comment-input-area { padding: 10px; display: flex; gap: 5px; }
        .comment-input { flex: 1; background: #222; border: 1px solid var(--gold); color: white; padding: 5px; }
        
        #chat-area { display: none; padding: 20px; max-width: 900px; margin: auto; }
        footer { padding: 60px; color: var(--gold); opacity: 0.6; font-size: 0.8rem; }
    </style>
</head>
<body>

<div id="login-screen">
    <h1 style="color: var(--gold); letter-spacing: 12px;">JAGIRDAR</h1>
    <div class="login-box">
        <button class="login-btn" style="background: #fff; color: #000;" onclick="loginGoogle()">SIGN IN WITH GOOGLE</button>
        <button class="login-btn" style="background: transparent; border: 1px solid var(--gold); color: var(--gold);" onclick="loginGuest()">CONTINUE AS GUEST</button>
    </div>
</div>

<div id="main-content" style="display: none;">
    <header>
        <h1 style="color: var(--gold); letter-spacing: 8px;">JAGIRDAR</h1>
        <div class="tabs">
            <button class="tab-btn active" onclick="location.reload()">GALLERY</button>
            <button class="tab-btn" onclick="showChat(event)">CHAT ✉️</button>
            <button class="tab-btn" onclick="auth.signOut()">LOGOUT</button>
        </div>
    </header>

    <div class="upload-section" id="upload-panel">
        <input type="file" id="file-input" accept="image/*,video/*" style="color: var(--gold);">
        <button onclick="uploadFile()" style="background: var(--gold); border:none; padding: 8px 15px; cursor:pointer; font-weight:bold;">POST TO LEGACY</button>
        <p id="up-status" style="font-size: 0.8rem; margin-top: 10px;"></p>
    </div>

    <div class="container" id="main-gallery"></div>
    <div id="chat-area">
        <iframe src="https://deadsimplechat.com/VcwE7MpUc" width="100%" height="600px" frameborder="0"></iframe>
    </div>

    <footer>© 2026 JAGIRDAR LEGACY | PAWAN SINGH RAJPUROHIT ☠️</footer>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyChMaUpvqhOwLwePpPv-X-24jFzQmRfrZs",
        authDomain: "jagirdar-c39e8.firebaseapp.com",
        projectId: "jagirdar-c39e8",
        storageBucket: "jagirdar-c39e8.appspot.com",
        messagingSenderId: "379511970061",
        appId: "1:379511970061:web:abb7e3bda9d76617687844"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
            loadGallery();
        } else {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('main-content').style.display = 'none';
        }
    });

    function loginGoogle() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function loginGuest() { auth.signInAnonymously(); }

    async function uploadFile() {
        const file = document.getElementById('file-input').files[0];
        if(!file) return alert("Select a file first!");
        if(auth.currentUser.isAnonymous) return alert("Guests cannot upload. Please Sign-in with Google.");

        const status = document.getElementById('up-status');
        status.innerText = "Uploading to Legacy...";
        
        const fileName = Date.now() + "_" + file.name;
        const storageRef = storage.ref('gallery/' + fileName);
        
        try {
            const snapshot = await storageRef.put(file);
            const url = await snapshot.ref.getDownloadURL();
            await db.collection('posts').add({
                url: url,
                type: file.type.startsWith('video') ? 'video' : 'photo',
                owner: auth.currentUser.uid,
                ownerName: auth.currentUser.displayName || "Jagirdar",
                createdAt: Date.now()
            });
            status.innerText = "Post Live! Refreshing...";
            setTimeout(() => location.reload(), 1500);
        } catch(e) { alert("Error: " + e.message); }
    }

    async function loadGallery() {
        const container = document.getElementById('main-gallery');
        container.innerHTML = "☠️ FETCHING LEGACY...";
        const snap = await db.collection('posts').orderBy('createdAt', 'desc').get();
        
        let html = "";
        snap.forEach(doc => {
            const data = doc.data();
            const id = doc.id;
            const isOwner = auth.currentUser && auth.currentUser.uid === data.owner;

            html += `
            <div class="card">
                ${data.type === 'video' ? `<video controls><source src="${data.url}"></video>` : `<img src="${data.url}" loading="lazy">`}
                <div class="actions">
                    <button class="action-btn" onclick="toggleLike('${id}')">❤️ <span id="like-${id}">0</span></button>
                    <button class="action-btn" onclick="shareMedia('${data.url}')">🔗</button>
                    ${isOwner ? `<button class="action-btn del-btn" onclick="deletePost('${id}', '${data.url}')">🗑️ DELETE</button>` : ''}
                </div>
                <div class="comment-section" id="comments-${id}">Loading...</div>
                <div class="comment-input-area">
                    <input class="comment-input" id="input-${id}" placeholder="Say something...">
                    <button onclick="addComment('${id}')" style="background:var(--gold); border:none; padding:5px; cursor:pointer;">➤</button>
                </div>
            </div>`;
            
            updateLikesUI(id);
            loadComments(id);
        });
        container.innerHTML = html;
    }

    async function deletePost(id, url) {
        if(!confirm("Delete this memory forever?")) return;
        await db.collection('posts').doc(id).delete();
        // Storage delete usually needs extra permissions, but DB delete will hide it.
        location.reload();
    }

    async function toggleLike(id) {
        if(auth.currentUser.isAnonymous) return alert("Please Login to Like!");
        const uid = auth.currentUser.uid;
        const ref = db.collection('posts').doc(id).collection('likes').doc(uid);
        const doc = await ref.get();
        const postRef = db.collection('posts').doc(id);

        if(doc.exists) {
            await ref.delete();
        } else {
            await ref.set({liked: true});
        }
        updateLikesUI(id);
    }

    async function updateLikesUI(id) {
        const snap = await db.collection('posts').doc(id).collection('likes').get();
        document.getElementById(`like-${id}`).innerText = snap.size;
    }

    async function addComment(id) {
        const input = document.getElementById(`input-${id}`);
        if(!input.value) return;
        if(auth.currentUser.isAnonymous) return alert("Please Login to Comment!");
        
        await db.collection('posts').doc(id).collection('comments').add({
            text: input.value,
            user: auth.currentUser.displayName || "Jagirdar",
            time: Date.now()
        });
        input.value = '';
        loadComments(id);
    }

    async function loadComments(id) {
        const box = document.getElementById(`comments-${id}`);
        const snap = await db.collection('posts').doc(id).collection('comments').orderBy('time', 'desc').limit(5).get();
        box.innerHTML = snap.docs.map(d => `<div><b>${d.data().user}:</b> ${d.data().text}</div>`).join('');
    }

    function shareMedia(url) { window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent("JAGIRDAR Legacy: " + url)}`); }
    function showChat(e) {
        document.getElementById('main-gallery').style.display = 'none';
        document.getElementById('upload-panel').style.display = 'none';
        document.getElementById('chat-area').style.display = 'block';
    }
</script>
</body>
</html>
