<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jagirdar Chat</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 75%; padding: 12px; border-radius: 15px; font-size: 0.95rem; line-height: 1.4; position: relative; }
        .mine { align-self: flex-end; background: var(--gold); color: black; border-bottom-right-radius: 2px; }
        .theirs { align-self: flex-start; background: #1a1a1a; border: 1px solid #333; border-bottom-left-radius: 2px; }
        .u-name { font-size: 0.7rem; opacity: 0.7; margin-bottom: 4px; display: block; font-weight: bold; }
        .input-area { padding: 15px; background: #0a0a0a; display: flex; gap: 10px; border-top: 1px solid #222; }
        input { flex: 1; background: #1a1a1a; border: 1px solid var(--gold); color: white; padding: 12px 20px; border-radius: 25px; outline: none; }
        button { background: var(--gold); border: none; width: 50px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        button:hover { transform: scale(1.1); box-shadow: 0 0 10px var(--gold); }
    </style>
</head>
<body>
    <div id="messages"></div>
    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Apna sandesh likhein...">
        <button onclick="send()">➤</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyChMaUpvqhOwLwePpPv-X-24jFzQmRfrZs",
            authDomain: "jagirdar-c39e8.firebaseapp.com",
            projectId: "jagirdar-c39e8",
            storageBucket: "jagirdar-c39e8.firebasestorage.app",
            messagingSenderId: "379511970061",
            appId: "1:379511970061:web:abb7e3bda9d76617687844"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Index.html se user data lena (LocalStorage se)
        const userName = localStorage.getItem('jg_name') || "Mehmaan";
        const userUid = localStorage.getItem('jg_uid') || "Guest";

        function send() {
            const val = document.getElementById('msgInput').value;
            if(!val) return;
            
            db.collection('global_chat').add({
                text: val,
                sender: userName,
                uid: userUid,
                time: Date.now()
            });
            document.getElementById('msgInput').value = '';
        }

        db.collection('global_chat').orderBy('time', 'asc').limitToLast(50).onSnapshot(snap => {
            const box = document.getElementById('messages');
            box.innerHTML = '';
            snap.forEach(doc => {
                const d = doc.data();
                const isMe = d.uid === userUid;
                box.innerHTML += `
                    <div class="msg ${isMe ? 'mine' : 'theirs'}">
                        <span class="u-name">${d.sender}</span>
                        ${d.text}
                    </div>`;
            });
            box.scrollTop = box.scrollHeight;
        });

        // Enter key se send
        document.getElementById('msgInput').addEventListener("keypress", (e) => {
            if (e.key === "Enter") send();
        });
    </script>
</body>
</html>
