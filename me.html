<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAGIRDAR 4898 | Profile</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        body { background: var(--black); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; text-align: center; }
        .profile-container { padding: 20px; max-width: 600px; margin: auto; }
        .profile-pic { width: 100px; height: 100px; border-radius: 50%; border: 2px solid var(--gold); margin-bottom: 10px; object-fit: cover; }
        .user-name { font-size: 1.5rem; color: var(--gold); margin: 5px 0; }
        .user-email { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
        .edit-btn, .logout-btn { background: var(--gold); border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; margin: 5px; }
        .logout-btn { background: #ff4444; color: white; }
        .my-uploads { margin-top: 30px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 10px; }
        .my-uploads img { width: 100%; aspect-ratio: 1; object-fit: cover; border: 1px solid #333; border-radius: 8px; }
        input[type="text"] { background: #222; border: 1px solid var(--gold); color: white; padding: 8px; border-radius: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="profile-container">
    <img id="userPic" src="https://via.placeholder.com/100" class="profile-pic">
    <div id="displayArea">
        <h2 id="userName" class="user-name">Loading...</h2>
        <p id="userEmail" class="user-email">...</p>
        <button class="edit-btn" onclick="toggleEdit()">Edit Profile</button>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
    
    <div id="editArea" style="display:none;">
        <input type="text" id="newName" placeholder="Enter New Name"><br>
        <button class="edit-btn" onclick="saveName()">Save Changes</button>
        <button class="edit-btn" style="background:#555" onclick="toggleEdit()">Cancel</button>
    </div>

    <hr style="border: 0.5px solid #333; margin: 30px 0;">
    <h3>MY UPLOADS ☠️</h3>
    <div id="userPhotos" class="my-uploads">
        </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<script>
    // Apni wahi purani Firebase Config yahan dalo
    const firebaseConfig = {
        apiKey: "AIzaSyChMaUpvqhOwLwePpPv-X-24jFzQmRfrZs",
        authDomain: "jagirdar-c39e8.firebaseapp.com",
        projectId: "jagirdar-c39e8",
        storageBucket: "jagirdar-c39e8.firebasestorage.app",
        messagingSenderId: "379511970061",
        appId: "1:379511970061:web:abb7e3bda9d76617687844"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('userName').innerText = user.displayName || "Jagirdar User";
            document.getElementById('userEmail').innerText = user.email;
            document.getElementById('userPic').src = user.photoURL || "https://via.placeholder.com/100";
            loadUserPhotos(user.uid);
        } else {
            window.location.href = "index.html"; // Agar login nahi hai toh wapas bhej do
        }
    });

    function toggleEdit() {
        const da = document.getElementById('displayArea');
        const ea = document.getElementById('editArea');
        da.style.display = da.style.display === 'none' ? 'block' : 'none';
        ea.style.display = ea.style.display === 'none' ? 'block' : 'none';
    }

    function saveName() {
        const name = document.getElementById('newName').value;
        if(name) {
            auth.currentUser.updateProfile({ displayName: name }).then(() => {
                alert("Name Updated!");
                location.reload();
            });
        }
    }

    function logout() {
        auth.signOut().then(() => window.location.href = "index.html");
    }

    function loadUserPhotos(uid) {
        db.collection('photos').where('userId', '==', uid).get().then(snap => {
            const box = document.getElementById('userPhotos');
            snap.forEach(doc => {
                const data = doc.data();
                box.innerHTML += `<img src="${data.url}">`;
            });
        });
    }
</script>
</body>
</html>
